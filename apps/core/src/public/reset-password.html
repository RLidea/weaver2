<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
    .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
    h2 { color: #333; margin-bottom: 24px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
    input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background-color 0.2s; }
    button:hover { background-color: #0056b3; }
    .message { margin-top: 20px; padding: 12px; border-radius: 4px; font-weight: 500; }
    .message.success { background-color: #e7f4e8; color: #28a745; }
    .message.error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="container">
  <h2>Reset Your Password</h2>
  <form id="reset-form">
    <div class="input-group">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" required minlength="8">
    </div>
    <div class="input-group">
      <label for="password-confirm">Confirm New Password</label>
      <input type="password" id="password-confirm" name="password-confirm" required minlength="8">
    </div>
    <button type="submit">Change Password</button>
  </form>
  <div id="message-container"></div>
</div>

<script>
  const API_BASE_URL = window.location.origin; // Assumes frontend is served from the same origin as the API
  const form = document.getElementById('reset-form');
  const passwordInput = document.getElementById('password');
  const passwordConfirmInput = document.getElementById('password-confirm');
  const messageContainer = document.getElementById('message-container');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    messageContainer.innerHTML = '';

    if (passwordInput.value !== passwordConfirmInput.value) {
      displayMessage('Passwords do not match.', 'error');
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      displayMessage('No reset token found in URL.', 'error');
      return;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/auth/password/reset`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          token: token,
          password: passwordInput.value,
        }),
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || 'An unknown error occurred.');
      }

      displayMessage('Password has been reset successfully!', 'success');
      form.reset();
      form.style.display = 'none';

    } catch (error) {
      displayMessage(`Error: ${error.message}`, 'error');
    }
  });

  function displayMessage(message, type) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${type}`;
    messageDiv.textContent = message;
    messageContainer.appendChild(messageDiv);
  }
</script>

</body>
</html>
