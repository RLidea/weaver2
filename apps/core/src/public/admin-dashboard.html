<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; }
        .sidebar { width: 200px; background-color: #2c3e50; color: white; padding: 20px; height: 100vh; box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
        .sidebar h2 { text-align: center; margin-bottom: 30px; color: #ecf0f1; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { margin-bottom: 15px; }
        .sidebar ul li a { color: white; text-decoration: none; display: block; padding: 10px; border-radius: 5px; transition: background-color 0.3s; }
        .sidebar ul li a:hover { background-color: #34495e; }
        .main-content { flex-grow: 1; padding: 20px; background-color: #ecf0f1; }
        .dashboard-header { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); text-align: center; margin-bottom: 20px; }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="#">User List</a></li>
            <li><a href="#">User Search</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#" id="logout-link">Logout</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="dashboard-header">
            <h1>Welcome to the Admin Dashboard!</h1>
            <p>You are logged in as an ADMIN.</p>
        </div>
        <!-- 대시보드 내용이 여기에 표시됩니다. -->
        <p>This is a placeholder for your dashboard content. You can add charts, statistics, and other administrative tools here.</p>
    </div>

    <script>
        document.getElementById('logout-link').addEventListener('click', async (event) => {
            event.preventDefault();
            try {
                const response = await fetch('/v1/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (response.ok) {
                    window.location.href = '/admin/login'; // Redirect to login page after logout
                } else {
                    alert('Logout failed. Please try again.');
                }
            } catch (error) {
                alert('An error occurred during logout.');
            }
        });
    </script>
</body>
</html>
