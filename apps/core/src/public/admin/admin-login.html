<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Secure Access</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-login.css" rel="stylesheet">
</head>
<body class="bg-pattern">
<div class="login-container glass glow-border shine">
    <div class="login-header">
        <div class="login-icon icon icon-lg">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="login-title text-primary text-shadow">Admin Portal</h1>
        <p class="login-subtitle text-secondary">Secure access to administrative dashboard<br>Please authenticate to continue</p>
    </div>

    <form id="loginForm" class="login-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-input glass-focus"
              placeholder="Enter your email address"
              required
              autocomplete="email"
            >
            <i class="fas fa-envelope input-icon"></i>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-input glass-focus"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <i class="fas fa-lock input-icon"></i>
        </div>

        <div class="remember-me">
            <label>
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="login-button btn btn-primary">
            <span class="loading-spinner"></span>
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
    </form>

    <div id="errorMessage" class="error-message"></div>

    <div class="footer-text">
        <i class="fas fa-lock"></i> Secure connection protected by SSL encryption
    </div>
</div>

<script src="/admin/js/admin-login.js"></script>
</body>
</html>
