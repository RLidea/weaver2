<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-dashboard.css" rel="stylesheet">
</head>
<body class="bg-pattern">
<div id="admin-menu-placeholder"></div>

<div class="main-content">
    <div class="dashboard-header card">
        <h1 class="text-primary text-shadow"><i class="fas fa-shield-alt"></i> Security Settings</h1>
        <p class="text-secondary">Manage system security and access controls</p>
    </div>

    <div class="dashboard-cards">
        <div class="card">
            <div class="card-header">
                <div class="card-icon icon icon-md users">
                    <i class="fas fa-user-lock"></i>
                </div>
                <div>
                    <div class="card-title text-primary">Access Control</div>
                    <div class="card-description text-secondary">Manage user roles and permissions</div>
                </div>
            </div>
            <div class="card-number text-primary"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon icon icon-md search">
                    <i class="fas fa-history"></i>
                </div>
                <div>
                    <div class="card-title text-primary">Audit Logs</div>
                    <div class="card-description text-secondary">Review system activity logs</div>
                </div>
            </div>
            <div class="card-number text-primary"></div>
        </div>
    </div>
</div>

<script src="/admin/js/admin-menu.js"></script>
<script src="/admin/js/admin-security.js"></script>
</body>
</html>
