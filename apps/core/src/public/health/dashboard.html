<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaver2 Health Dashboard</title>
    <link rel="stylesheet" href="/health/dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Weaver2 Health Dashboard</h1>
            <p>실시간 시스템 상태 모니터링</p>
            <div class="health-badge">System Monitor</div>
        </div>

        <div id="loading" class="loading">
            시스템 상태를 확인하는 중...
        </div>

        <div id="error-container"></div>

        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- 대시보드 내용이 여기에 동적으로 생성됩니다 -->
        </div>

        <button id="refresh-btn" class="refresh-btn">
            🔄 새로고침
        </button>

        <div id="timestamp" class="timestamp"></div>
    </div>

    <script src="/health/dashboard.js"></script>
</body>
</html>
