<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-dashboard.css" rel="stylesheet"> <!-- Reusing dashboard CSS for now -->
</head>
<body class="bg-pattern">
<div id="admin-menu-placeholder"></div>

<div class="main-content">
    <div class="dashboard-header card">
        <h1 class="text-primary text-shadow"><i class="fas fa-users"></i> User Management</h1>
        <p class="text-secondary">Manage all users in the system</p>
    </div>

    <div class="dashboard-cards">
        <!-- User management specific content will go here -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon icon icon-md users">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div>
                    <div class="card-title text-primary">Add New User</div>
                    <div class="card-description text-secondary">Create new user accounts</div>
                </div>
            </div>
            <div class="card-number text-primary"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon icon icon-md search">
                    <i class="fas fa-search"></i>
                </div>
                <div>
                    <div class="card-title text-primary">Search Users</div>
                    <div class="card-description text-secondary">Find users by various criteria</div>
                </div>
            </div>
            <div class="card-number text-primary"></div>
        </div>
    </div>
</div>

<script src="/admin/js/admin-menu.js"></script>
<script src="/admin/js/admin-user-management.js"></script> <!-- Specific JS for user management -->
</body>
</html>
