<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-dashboard.css" rel="stylesheet">
    <link href="/shared/components/tabs/tabs.css" rel="stylesheet">
    <link href="/admin/css/admin-analytics.css" rel="stylesheet">
</head>
<body class="bg-pattern">
<div id="admin-menu-placeholder"></div>

<div class="main-content">
    <div class="dashboard-header card">
        <h1 class="text-primary text-shadow"><i class="fas fa-chart-bar"></i> Analytics Dashboard</h1>
        <p class="text-secondary">Detailed insights and system analytics</p>
    </div>

    <!-- Date Range Filter -->
    <div class="card search-filters">
        <div class="search-section">
            <h3><i class="fas fa-calendar-alt"></i> Time Range Filter</h3>
        </div>
        
        <div class="filter-section">
            <div class="filter-group">
                <label for="dateFrom">From Date</label>
                <input type="date" id="dateFrom" class="form-input">
            </div>
            <div class="filter-group">
                <label for="dateTo">To Date</label>
                <input type="date" id="dateTo" class="form-input">
            </div>
            <div class="filter-group">
                <label>&nbsp;</label>
                <div style="display: flex; gap: var(--spacing-sm);">
                    <button id="applyDateFilter" class="btn btn-primary">
                        <i class="fas fa-filter"></i> Apply
                    </button>
                    <button id="resetDateFilter" class="btn btn-secondary">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Analytics Tabs Container -->
    <div class="card">
        <div id="analytics-tabs-container">
            <!-- Tabs will be loaded here by JavaScript -->
        </div>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="/shared/components/tabs/tabs.js"></script>
<script src="/admin/js/admin-menu.js"></script>
<script src="/admin/js/admin-analytics.js"></script>
</body>
</html>
