<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-dashboard.css" rel="stylesheet">
</head>
<body class="bg-pattern">
<div id="admin-menu-placeholder"></div>

<div class="main-content">
    <div class="dashboard-header card">
        <h1 class="text-primary text-shadow"><i class="fas fa-file-alt"></i> Content Management</h1>
        <p class="text-secondary">Manage articles, pages, and media</p>
    </div>

    <div class="dashboard-cards">
        <div class="card">
            <div class="card-header">
                <div class="card-icon icon icon-md users">
                    <i class="fas fa-newspaper"></i>
                </div>
                <div>
                    <div class="card-title text-primary">Articles</div>
                    <div class="card-description text-secondary">Manage blog posts and news</div>
                </div>
            </div>
            <div class="card-number text-primary"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon icon icon-md search">
                    <i class="fas fa-images"></i>
                </div>
                <div>
                    <div class="card-title text-primary">Media Library</div>
                    <div class="card-description text-secondary">Upload and organize images/videos</div>
                </div>
            </div>
            <div class="card-number text-primary"></div>
        </div>
    </div>
</div>

<script src="/admin/js/admin-menu.js"></script>
<script src="/admin/js/admin-content-management.js"></script>
</body>
</html>
