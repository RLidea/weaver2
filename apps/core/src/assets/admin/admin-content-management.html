<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-dashboard.css" rel="stylesheet">
    <link href="/shared/components/data-table/data-table.css" rel="stylesheet">
    <link href="/shared/components/modal/common-modal.css" rel="stylesheet">
    <link href="/shared/components/modal/board-permissions-modal.css" rel="stylesheet">
    <link href="/shared/components/modal/post-detail-modal.css" rel="stylesheet">
    <link href="/shared/components/tabs/tabs.css" rel="stylesheet">
    <style>
        .content-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
        }
        
        .content-tab {
            padding: 1rem 2rem;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .content-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        
        .content-tab:hover {
            color: var(--primary-color);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        
        .permission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        
        .permission-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .permission-header {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .permission-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .permission-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body class="bg-pattern">
<div id="admin-menu-placeholder"></div>

<div class="main-content">
    <div class="dashboard-header card">
        <h1 class="text-primary text-shadow"><i class="fas fa-file-alt"></i> Content Management</h1>
        <p class="text-secondary">Manage boards, posts, comments, and permissions</p>
    </div>

    <!-- Content Statistics -->
    <div id="content-stats" class="stats-grid">
        <!-- Stats will be loaded here -->
    </div>

    <!-- Content Tabs Container -->
    <div class="card">
        <div id="content-tabs-container">
            <!-- Tabs will be loaded here by JavaScript -->
        </div>
    </div>
</div>

<!-- Modals will be created dynamically by modal components -->

<script src="/shared/components/data-table/data-table.js"></script>
<script src="/shared/components/modal/common-modal.js"></script>
<script src="/shared/utils/api-client.js"></script>
<script src="/shared/utils/url-state.js"></script>
<script src="/shared/components/tabs/tabs.js"></script>
<script src="/shared/components/modal/board-permissions-modal.js"></script>
<script src="/shared/components/modal/post-detail-modal.js"></script>
<script src="/admin/js/admin-menu.js"></script>
<script src="/admin/js/admin-content-management.js"></script>
</body>
</html>
