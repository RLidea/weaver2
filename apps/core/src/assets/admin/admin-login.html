<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Secure Access</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-login.css" rel="stylesheet">
    <style>
        /* 초기 로딩 상태 */
        .login-container {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        .login-container.show {
            opacity: 1;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-overlay.hide {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }
        
        .loading-content {
            text-align: center;
            color: white;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-pattern">
<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <h3>Checking authentication...</h3>
        <p>Please wait while we verify your session</p>
    </div>
</div>

<div class="login-container glass glow-border shine" id="loginContainer">
    <div class="login-header">
        <div class="login-icon icon icon-lg">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="login-title text-primary text-shadow">Admin Portal</h1>
        <p class="login-subtitle text-secondary">Secure access to administrative dashboard<br>Please authenticate to continue</p>
    </div>

    <form id="loginForm" class="login-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-input glass-focus"
              placeholder="Enter your email address"
              required
              autocomplete="email"
            >
            <i class="fas fa-envelope input-icon"></i>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-input glass-focus"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <i class="fas fa-lock input-icon"></i>
        </div>

        <div class="remember-me">
            <label>
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>
            <a href="/admin/request-password-reset" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="login-button btn btn-primary">
            <span class="loading-spinner"></span>
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
    </form>

    <div id="errorMessage" class="error-message"></div>

    <div class="footer-text">
        <i class="fas fa-lock"></i> Secure connection protected by SSL encryption
    </div>
</div>

<script src="/shared/utils/api-client.js"></script>
<script src="/admin/js/admin-login.js"></script>
</body>
</html>
