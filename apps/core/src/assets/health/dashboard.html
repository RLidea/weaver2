<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaver2 Health Dashboard</title>
    <link rel="stylesheet" href="/static/shared/styles/design-system.css">
    <link rel="stylesheet" href="/static/shared/styles/components.css">
    <link rel="stylesheet" href="/health/dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weaver2 Health Dashboard</h1>
            <p>Real-time system status monitoring</p>
            <div class="weaver-status-badge info">System Monitor</div>
        </div>

        <div id="loading" class="loading">
            Checking system status...
        </div>

        <div id="error-container"></div>

        <div class="refresh-section">
            <button id="refresh-btn" class="weaver-button primary">
                🔄 Refresh
            </button>
        </div>

        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- Dashboard content will be dynamically generated here -->
        </div>

        <div id="timestamp" class="timestamp"></div>
    </div>

    <script type="module" src="/health/dashboard.js"></script>
</body>
</html>
