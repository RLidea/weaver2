<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password Request - Weaver2 Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/shared/styles/components.css" rel="stylesheet">
    <link href="/static/admin/css/admin-common.css" rel="stylesheet">
    <link href="/static/admin/css/admin-login.css" rel="stylesheet">
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #007bff;
        }
        .form-description {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .success-message {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            text-align: center;
        }
        .success-message i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card glass-effect">
            <div class="login-header">
                <a href="/admin/login" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Login
                </a>
                <div class="logo">
                    <i class="fas fa-key"></i>
                    <h1>Reset Password</h1>
                </div>
                <p class="form-description">
                    Enter your registered email address<br>
                    and we'll send you a password reset link.
                </p>
            </div>

            <div id="success-container" class="success-message" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <div>
                    <strong>Email sent successfully!</strong><br>
                    <small>Please check your email and click the link to reset your password.</small>
                </div>
            </div>

            <form id="resetRequestForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input glass-focus"
                        placeholder="admin@example.com"
                        required
                        autocomplete="email"
                    >
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <button type="submit" class="login-button btn btn-primary">
                    <span class="loading-spinner"></span>
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <div class="login-footer">
                <p>Remember your account? <a href="/admin/login">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="/static/admin/js/request-password-reset.js"></script>
</body>
</html>
