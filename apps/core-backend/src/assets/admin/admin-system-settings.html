<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/shared/styles/components.css" rel="stylesheet">
    <link href="/admin/css/admin-common.css" rel="stylesheet">
    <link href="/admin/css/admin-dashboard.css" rel="stylesheet">
    <link href="/shared/components/tabs/tabs.css" rel="stylesheet">
    <style>
        /* Form Styles for System Settings */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: var(--font-weight-semibold);
            font-family: var(--font-family);
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-small);
            font-size: 1rem;
            font-family: var(--font-family);
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            background-color: var(--glass-bg-strong);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            box-shadow: var(--inset-shadow);
        }
        
        .form-control:focus {
            outline: 0;
            border-color: var(--primary-blue);
            box-shadow: var(--border-color-focus);
            background-color: var(--glass-bg-focus);
        }
        
        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: var(--glass-bg);
            border-radius: var(--border-radius-small);
            border: 1px solid var(--border-color);
        }
        
        .form-check:hover {
            background: var(--glass-bg-hover);
        }
        
        .form-check-input {
            margin-right: var(--spacing-md);
            transform: scale(1.3);
            accent-color: var(--primary-blue);
        }
        
        .form-check-label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: var(--font-weight-medium);
            color: var(--text-primary);
        }
        
        /* Button styles are now centralized in shared/styles/components/buttons.css */
        
        .text-secondary {
            color: var(--text-secondary, #6c757d) !important;
            font-size: 0.875rem;
        }
        
        .d-block {
            display: block !important;
        }
        
        .mt-2 {
            margin-top: 0.5rem !important;
        }
        
        /* Card content spacing */
        .card-content {
            padding: var(--spacing-xl);
        }
        
        /* Enhanced card styling */
        .tab-content .card {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            margin-bottom: var(--spacing-lg);
        }
        
        .tab-content .card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--border-color-hover);
        }
        
        /* Loading container styles */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-3xl);
            color: var(--text-secondary);
        }
        
        .loading-container i {
            font-size: 2rem;
            margin-bottom: var(--spacing-md);
            color: var(--primary-blue);
        }
        
        .loading-container p {
            margin: 0;
            font-size: 1rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .form-control {
                padding: 0.5rem;
            }
            
            /* Button responsive styles handled by components/buttons.css */
        }
    </style>
</head>
<body class="bg-pattern">
<div id="admin-menu-placeholder"></div>

<div class="main-content">
    <div class="dashboard-header card">
        <h1 class="text-primary text-shadow"><i class="fas fa-cog"></i> System Settings</h1>
        <p class="text-secondary">Configure global system parameters</p>
    </div>

    <!-- Tab Container -->
    <div id="system-settings-tabs-container"></div>
</div>

<script src="/shared/utils/api-client.js"></script>
<script src="/shared/utils/i18n.js"></script>
<script src="/shared/utils/url-state.js"></script>
<script src="/shared/components/tabs/tabs.js"></script>
<script src="/admin/js/admin-menu.js"></script>
<script src="/admin/js/admin-language-settings.js"></script>
<script src="/admin/js/admin-system-settings.js"></script>
</body>
</html>
