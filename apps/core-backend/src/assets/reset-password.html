<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Weaver2 Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/admin/css/admin-common.css" rel="stylesheet">
    <link href="/static/admin/css/admin-login.css" rel="stylesheet">
    <link href="/static/admin/css/password-reset.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card glass-effect">
            <div class="login-header">
                <a href="/admin/login" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Login
                </a>
                <div class="logo">
                    <i class="fas fa-key"></i>
                    <h1>Reset Password</h1>
                </div>
                <p class="form-description">
                    Set your new password.
                </p>
            </div>

            <div id="message-container"></div>

            <div class="password-requirements">
                <strong>Password Requirements:</strong>
                <ul>
                    <li>At least 8 characters</li>
                    <li>Recommended to include letters, numbers, and special characters</li>
                </ul>
            </div>

            <form id="reset-form" class="login-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input glass-focus"
                        placeholder="Enter your new password"
                        required 
                        minlength="8"
                        autocomplete="new-password"
                    >
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye password-toggle" data-target="password"></i>
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirm Password</label>
                    <input 
                        type="password" 
                        id="password-confirm" 
                        name="password-confirm" 
                        class="form-input glass-focus"
                        placeholder="Confirm your new password"
                        required 
                        minlength="8"
                        autocomplete="new-password"
                    >
                    <i class="fas fa-lock input-icon"></i>
                    <i class="fas fa-eye password-toggle" data-target="password-confirm"></i>
                </div>

                <button type="submit" class="login-button btn btn-primary">
                    <span class="loading-spinner"></span>
                    <i class="fas fa-check"></i> Change Password
                </button>
            </form>

            <div class="login-footer">
                <p>Remember your password? <a href="/admin/login">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="/static/admin/js/password-reset.js"></script>
</body>
</html>
