<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaver2 Health Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/shared/styles/design-system.css" rel="stylesheet">
    <link href="/shared/styles/components/cards.css" rel="stylesheet">
    <link href="/shared/styles/components/buttons.css" rel="stylesheet">
    <link href="/shared/styles/components/badges.css" rel="stylesheet">
    <link href="/shared/styles/components/progress.css" rel="stylesheet">
    <link rel="stylesheet" href="/health/dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weaver2 Health Dashboard</h1>
            <p>Real-time system status monitoring</p>
            <div class="weaver-status-badge info">System Monitor</div>
        </div>

        <div id="loading" class="loading">
            Checking system status...
        </div>

        <div id="error-container"></div>

        <div class="refresh-section">
            <button id="refresh-btn" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- Dashboard content will be dynamically generated here -->
        </div>

        <div id="timestamp" class="timestamp"></div>
    </div>

    <script src="/shared/utils/api-client.js"></script>
    <script type="module" src="/shared/components/card/card.js"></script>
    <script src="/health/dashboard.js"></script>
</body>
</html>
