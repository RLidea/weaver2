packages:
  - 'apps/core-frontend'
  - 'packages/*'

# 빌드 스크립트(postinstall 등) 실행 허용 여부 — 전부 false = 돌리지 않는다.
#
# 이 저장소는 install 시 임의 스크립트 실행을 열지 않는 것이 기본이며,
# Prisma 클라이언트는 `pnpm db:generate` 로 명시적으로 생성한다 (README §2, `pnpm run init`에 포함).
#
# pnpm 11 은 빌드 스크립트를 가진 패키지 "전부"에 대해 명시적 boolean 결정을 요구한다.
# 미선언 항목이 하나라도 있으면 install 이 ERR_PNPM_IGNORED_BUILDS 로 종료 코드 1을 내고,
# 결정을 받으려 이 `allowBuilds:` 블록을 placeholder 값으로 자동 주입한다.
# 그러면 deps 체크를 거치는 모든 pnpm 스크립트(테스트·pre-commit 훅 포함)가 막힌다.
#
# 아래는 그 결정을 "기록"한 것이다 — 실제 동작은 기존과 동일하고, 허용을 넓히지 않는다.
# 특정 패키지의 빌드를 열어야 하면 해당 항목만 true 로 바꾼다(공급망 영향 검토 후).
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/client': false
  '@prisma/engines': false
  '@scarf/scarf': false
  bcrypt: false
  core-js-pure: false
  esbuild: false
  prisma: false
  sharp: false
  unrs-resolver: false

# 남이 끌고 오는 취약 패키지를 여기서 못박는다 (2026-09-15).
#
# 🔴 **먼저 `pnpm update -r --depth Infinity` 를 돌려 보고, 그래도 남는 것만 적는다.**
#    이 저장소에서 실측: 락파일을 당기는 것만으로 권고 106건이 19건이 되었다
#    (critical 1 포함). validator·js-yaml·lodash·qs·path-to-regexp·body-parser·
#    fast-xml-parser·file-type·fflate·jws 는 **전부 override 없이 닫혔다** —
#    상위가 이미 `^` 로 고친 판을 허용하는데 락파일만 낡아서 안 받고 있었을 뿐이다.
#    override 는 남의 트리를 강제로 비트는 일이라, 상위가 판을 올릴 때 발목을 잡는다.
#
# 🔴 **오른쪽에 상한을 둔다 (`^`).** `>=2.3.0` 처럼 열어두면 pnpm 이 최신을 고르고
#    그 최신이 다음 메이저일 수 있다. audit 은 초록이 되지만 그건 취약점을 고친 것이
#    아니라 판을 갈아엎은 것이다. (mayoube-studio 에서 실제로 밟았다 — `>=` 로 적었더니
#    jws 3→4, fast-uri 3→4, js-yaml 4→5 로 갈아끼워졌다.)
#
# 지울 수 있는 때: 그 줄이 가리키는 상위가 스스로 판을 올려 audit 에 안 잡히게 되면.
# 확인법: 한 줄 지우고 `pnpm install && pnpm audit` 로 다시 나오는지 본다.
overrides:
  # packages/* 가 peer 로만 받는 next 는 앱과 다른 @types/node 조합으로 따로 잠겨,
  # 앱의 next 를 올려도 낡은 판(16.3.5 · sharp 0.35.4)이 락파일에 남는다 (2026-10-09 실측).
  # `pnpm update -r --depth Infinity next sharp` 로도 안 내려왔다.
  # 지울 신호: 이 두 줄을 지우고 `pnpm install && pnpm audit --prod` 에 next·sharp 가 안 나오면.
  next@<16.3.8: 16.3.8
  sharp@<0.35.5: ^0.35.5

  # prisma 7.10 CLI 가 못으로 박는 둘 (2026-10-09). @prisma/client 가 prisma 를 peer 로 물어
  # audit 은 「프로덕션」으로 세지만, 둘 다 CLI(설정 병합·prisma dev 의 MySQL)에서만 돌고
  # 앱 번들·서버 런타임에는 실리지 않는다.
  #   mysql2 — prisma 가 3.15.3 을 박는다. 패치는 >=3.22.0, 같은 메이저라 그대로 올린다.
  #   deepmerge-ts — @prisma/config 가 7.1.5 를 박는다. 패치는 8 뿐이다. 8 의 깨지는 변경은
  #     Map 값 병합·타입 이름 변경·deepmergeInto 인데, @prisma/config 는 deepmerge() 로
  #     평범한 설정 객체만 합친다 — generate·validate·migrate deploy·db seed 로 확인했다.
  # 지울 신호: npm view prisma@<새판> dependencies.mysql2 가 >=3.22.0 이고
  #   npm view @prisma/config@<새판> dependencies 의 deepmerge-ts 가 >=8 이면.
  mysql2@<3.22.0: ^3.22.0
  deepmerge-ts@<8.0.0: ^8.0.0

# 고칠 판이 아직 없어 «드러내 놓고» 넘기는 권고 (2026-10-09). 둘 다 dev 도구 전용이고
# 운영 번들·서버에는 실리지 않는다. audit-gate 가 「넘긴 것」으로 따로 세어 보여 준다.
auditConfig:
  ignoreGhsas:
    # braces — 권고의 패치판 >=3.0.4 가 npm 에 아직 없다 (최신 3.0.3).
    # jest 29 → micromatch 4 가 문다. 지울 신호: npm view braces versions 에 3.0.4 가 생기면.
    - GHSA-vfj7-8cjw-p6xm
    # webpack-dev-middleware — 패치는 7.4.5 인데 @storybook/builder-webpack5 10.6.x 가 ^6 을 문다.
    # Storybook 로컬 개발 서버에서만 돈다. 지울 신호: 빌더가 ^7 을 물면.
    - GHSA-g84c-rxfj-3j2c
