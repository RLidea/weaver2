name: Security audit

on:
  schedule:
    # 매주 월요일 09:00 KST = 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/*/package.json'
      - 'libs/*/package.json'

# 🔴 이 블록이 없으면 이슈 생성이 403 으로 막힌다 — 그리고 조용히 막힌다.
#
# 이 저장소는 지금 기본 토큰 권한이 write 라 명시 없이도 이슈가 열리고 있다(#1~#19).
# 하지만 그건 **운**이다. 같은 워크플로를 물려받은 mayoube-studio 는 기본값이
# read-only 여서, 2026-08-03~09-14 **일곱 주 연속** 감사가 제때 돌고 취약점을 정확히
# 세고 이슈 본문까지 다 만든 뒤 마지막 한 걸음에서 죽었다:
#   RequestError [HttpError]: Resource not accessible by integration (403)
# 경보는 일곱 번 울렸고 일곱 번 다 문 앞에서 버려졌다 — 아무도 몰랐다.
#
# 저장소/org 기본값이 바뀌면 여기도 같은 병에 걸린다. 운에 맡기지 않고 명시한다.
permissions:
  contents: read
  issues: write

env:
  HUSKY: '0'

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 1) High/Critical만 fail-fast — 정기 알림용
      - name: Audit (High/Critical)
        id: audit
        run: pnpm audit --audit-level=high --json > audit-report.json || echo "audit_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-${{ github.run_number }}
          path: audit-report.json
          retention-days: 30

      # 2) 스케줄 실행에서 취약점 발견 시 GitHub Issue 생성
      - name: Open issue on vulnerabilities
        if: steps.audit.outputs.audit_failed == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '취약점 감지됨. 상세는 artifact 참조.';
            try {
              const data = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
              summary = '```json\n' + JSON.stringify(data.metadata?.vulnerabilities ?? data, null, 2) + '\n```';
            } catch (_) {}

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[security] pnpm audit found vulnerabilities (${new Date().toISOString().slice(0, 10)})`,
              body: [
                '주간 의존성 감사에서 High/Critical 취약점이 발견되었습니다.',
                '',
                summary,
                '',
                `- workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['security', 'dependencies'],
            });

      # 3) PR에서 발견된 경우 PR 상태 fail로 전파
      - name: Fail PR if audit found High/Critical
        if: steps.audit.outputs.audit_failed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::pnpm audit reported High/Critical vulnerabilities."
          exit 1
