name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # 매주 월요일 05:00 UTC = 14:00 KST
    # main에 변경이 없어도 정기적으로 분석을 돌려 신규 룰을 적용한다.
    - cron: '0 5 * * 1'
  workflow_dispatch:

# 동일 PR/branch에 새 push 들어오면 진행 중인 run 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # CodeQL이 결과를 Security 탭에 업로드하려면 필요
      security-events: write
      # private 의존성 패키지를 받아오려면 필요
      packages: read
      # SARIF 업로드 시 사용
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # apps/core-backend(NestJS) + apps/core-frontend(Next.js) 모두 TS/JS
        # 단일 언어로 묶어 분석하면 cross-file taint flow도 추적된다.
        language: [javascript-typescript]

    steps:
      # code scanning 업로드는 공개 레포만 무료다. 비공개 레포는 Advanced Security 가
      # 없으면 analyze 가 실패하므로, 이 템플릿을 받아 간 비공개 파생 레포에서는 건너뛴다.
      # github.event.repository 는 schedule 이벤트에 없어서 API 로 직접 묻는다.
      - name: Check repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" = "true" ]; then
            echo "::notice::비공개 레포라 CodeQL 을 건너뜁니다 (code scanning 은 Advanced Security 필요)."
          fi

      - name: Checkout
        if: steps.visibility.outputs.private == 'false'
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: steps.visibility.outputs.private == 'false'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended: 기본 쿼리 + 추가 보안 쿼리
          # security-and-quality: 위 + 코드 품질(unused vars 등) — false positive 많음
          queries: security-extended
          # node_modules 등 분석 제외 (config-file로도 가능하지만 인라인이 가벼움)
          config: |
            paths-ignore:
              - node_modules
              - dist
              - '**/.next'
              - '**/storybook-static'
              - apps/core-backend/prisma/schema/migrations
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/*.stories.tsx'

      - name: Perform CodeQL Analysis
        if: steps.visibility.outputs.private == 'false'
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
