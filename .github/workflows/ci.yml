name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 동일 PR/branch에 새 push 들어오면 진행 중인 run 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # husky가 CI에서 init되지 않도록 차단
  HUSKY: '0'
  # Next.js 빌드 시 텔레메트리 차단
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ── 0. Secret/key 파일 staging 차단 (Push ruleset 대체) ──────────
  secret-files:
    name: Forbidden file check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject .env*/keys in tree
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | awk '
            /(^|\/)\.env(\.[^\/]+)?$/ && !/\.env\.example/ { print }
            /\.(pem|key|p12|pfx|crt|cer)$/ { print }
            /(^|\/)(id_rsa|id_ed25519)/ { print }
          ' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::다음 파일이 저장소에 포함되어 있습니다 (secret/key 의심):"
            echo "$forbidden" | sed 's/^/::error::  - /'
            exit 1
          fi
          echo "✓ Secret/key 파일 없음."

  # ── 1. 의존성 설치 + 캐시 (모든 후속 job의 prerequisite) ─────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate --schema=apps/core-backend/prisma/schema
        env:
          # prisma generate는 DB에 연결하지 않으므로 더미 URL이면 충분
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # 다음 job들이 재사용할 수 있도록 .prisma client + node_modules 캐시
      - name: Cache node_modules + prisma client
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # ── 2. ESLint ────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - run: pnpm lint

  # ── 3. Unit tests ────────────────────────────────────────────────
  test-unit:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # --ci: watch off, --maxWorkers=2: GitHub-hosted runner CPU 매칭
      - run: npx jest --config apps/core-backend/jest.config.js --ci --maxWorkers=2

  # ── 4. Integration tests (Postgres 서비스 컨테이너) ────────────────
  test-integration:
    name: Integration tests
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weaver
          POSTGRES_PASSWORD: weaver
          POSTGRES_DB: weaver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://weaver:weaver@localhost:5432/weaver_test
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret-not-for-prod
      NODE_ENV: test
      # EmailService 생성자가 SMTP env 검증 후 throw하므로 더미 주입 필수.
      # 실제 발송은 일어나지 않음 (테스트가 EmailService를 호출하지 않음).
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '587'
      SMTP_USER: ci-test
      SMTP_PASS: ci-test-password

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Apply migrations
        run: pnpm prisma migrate deploy --schema=apps/core-backend/prisma/schema

      - name: Run integration tests
        # pnpm test:integration:run의 -- forwarding이 jest --ci 인자로 안 넘어가서
        # 직접 jest를 호출. config는 동일.
        run: npx jest --config apps/core-backend/test/jest-integration.json --no-coverage --ci --maxWorkers=2

  # ── 5. Backend build ─────────────────────────────────────────────
  build-backend:
    name: Build backend
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - run: npx nest build core-backend

  # ── 6. Frontend build (포함: TypeScript 검증) ─────────────────────
  build-web:
    name: Build web
    needs: install
    runs-on: ubuntu-latest
    env:
      # 빌드 단계 prerender에서 ApiClient 모듈이 평가되므로 더미 URL 주입.
      # 변수명은 apps/core-frontend/src/infrastructure/api-client.ts와 일치해야 함.
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: apps/core-frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/core-frontend/package.json', 'apps/core-frontend/**/*.[jt]s', 'apps/core-frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - run: pnpm --filter core-frontend exec next build

  # ── 7. Prisma schema drift / format ──────────────────────────────
  prisma-check:
    name: Prisma schema check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Validate schema
        run: pnpm prisma validate --schema=apps/core-backend/prisma/schema
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Format check
        run: pnpm prisma format --schema=apps/core-backend/prisma/schema --check
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  # ── 8. E2E (Playwright + 풀 스택 서비스) ─────────────────────────
  test-e2e:
    name: E2E (Playwright)
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weaver
          POSTGRES_PASSWORD: weaver
          POSTGRES_DB: weaver_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://weaver:weaver@localhost:5432/weaver_e2e
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret-not-for-prod
      # NODE_ENV=test 으로 두면 secure-cookie 강제가 비활성화되어
      # http://localhost로 cookie가 정상 전달됨. test-integration과 동일.
      NODE_ENV: test
      ORIGIN_URL: localhost:4000
      CLIENT_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
      PORT: '4000'
      # EmailService 생성자가 SMTP env 검증 후 throw하므로 더미 주입 필수.
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '587'
      SMTP_USER: ci-test
      SMTP_PASS: ci-test-password
      # frontend rewrites + browser-side ApiClient
      NEXT_PUBLIC_API_URL: /api
      API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Apply migrations
        run: pnpm prisma migrate deploy --schema=apps/core-backend/prisma/schema

      - name: Apply seeds (admin + permission groups + boards)
        run: pnpm db:seed

      - name: Build backend
        run: npx nest build core-backend

      - name: Build frontend
        run: pnpm --filter core-frontend exec next build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter core-frontend exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm --filter core-frontend e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/core-frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces / screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/core-frontend/test-results/
          retention-days: 7

  # ── 9. 종합 게이트 (Branch protection이 이 job 하나만 require해도 OK) ─
  ci-success:
    name: CI success
    if: always()
    needs:
      - secret-files
      - lint
      - test-unit
      - test-integration
      - test-e2e
      - build-backend
      - build-web
      - prisma-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required CI checks passed."
