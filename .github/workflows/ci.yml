name: CI

# 비용 정책 (2026-09-15, 「중간」): GitHub Actions 는 잡을 분 단위 올림으로 과금하므로,
# 벽시계가 아니라 「잡 수 × 트리거 빈도」가 비용이다. 그래서:
#   · 빠른 검사(lint·openapi·prisma·unit·build)를 잡 둘로 통합했다 (전엔 8잡).
#   · 무거운 검사(integration·E2E)는 **dev→main PR 에서만** 돈다 — 브라우저·DB 가
#     필요해 로컬·dev 마다 돌리기엔 비싸고, 배포 직전에만 있으면 충분하다.
#   · dev PR 트리거는 뺐다 — dev 로 들어가는 변경은 로컬 pre-push 게이트(.husky/pre-push)가
#     본다. CI 는 dev push(전수 요약)와 dev→main PR(배포 관문)에서만 돈다.
on:
  # dev = 레인들이 착륙하는 곳. push 마다 빠른 검사(통합 2잡)를 돌린다.
  push:
    branches: [dev]
  # 🔴 dev→main PR 만. main push 에는 검사가 없으므로(배포 전용) 이 PR 이 배포 직전
  #    마지막 관문이고, GitHub ruleset 이 여기 'CI success' 상태검사를 요구한다.
  #    이 트리거에서 main 을 빼면 그 검사가 생성되지 않아 dev→main PR 이 영영 머지
  #    불가가 된다 (CLAUDE.md). integration·E2E 도 여기서만 돈다.
  #    dev 는 뺐다 — dev PR 은 로컬 pre-push 가 본다.
  pull_request:
    branches: [main]
  workflow_dispatch:

# 동일 PR/branch에 새 push 들어오면 진행 중인 run 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # husky가 CI에서 init되지 않도록 차단
  HUSKY: '0'
  # Next.js 빌드 시 텔레메트리 차단
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ── 빠른 검사 (dev push·main PR 둘 다) ────────────────────────────
  # 전엔 secret-files·install·lint·openapi·unit·prisma 6잡이었다. 잡마다 1분씩
  # 올림 과금되므로 한 잡에서 순차로 돌려 과금 분을 줄인다. install 은 이 잡 안에서
  # 한 번 하고, 후속 잡(build)이 따로 install 한다 — 캐시 save/restore 춤보다 단순하다.
  checks:
    name: Checks (lint·openapi·prisma·unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # secret/key 파일이 트리에 들어왔는지 (Push ruleset 대체)
      - name: Reject .env*/keys in tree
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | awk '
            /(^|\/)\.env(\.[^\/]+)?$/ && !/\.env\.example/ { print }
            /\.(pem|key|p12|pfx|crt|cer)$/ { print }
            /(^|\/)(id_rsa|id_ed25519)/ { print }
          ' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::다음 파일이 저장소에 포함되어 있습니다 (secret/key 의심):"
            echo "$forbidden" | sed 's/^/::error::  - /'
            exit 1
          fi
          echo "✓ Secret/key 파일 없음."

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate --schema=apps/core-backend/prisma/schema
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # 🔴 lint 가 아니라 lint:check 다. 루트의 `lint` 는 `eslint … --fix` 라 러너에서
      #    고치고 초록을 낸다 — 검사가 아니라 수정이다. 프론트까지 함께 본다.
      - name: Lint
        run: pnpm lint:check

      - name: OpenAPI types up-to-date
        run: |
          pnpm openapi:types
          git diff --exit-code packages/api-client/src/types/api-schema.d.ts \
            || (echo "::error::api-schema.d.ts가 최신이 아닙니다. 'pnpm openapi:types' 실행 후 커밋하세요." && exit 1)

      - name: Prisma schema validate + format
        run: |
          pnpm prisma validate --schema=apps/core-backend/prisma/schema
          pnpm prisma format --schema=apps/core-backend/prisma/schema --check
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # --ci: watch off, --maxWorkers=2: GitHub-hosted runner CPU 매칭
      - name: Unit tests
        run: npx jest --config apps/core-backend/jest.config.js --ci --maxWorkers=2

  # ── 빌드 (dev push·main PR 둘 다) ─────────────────────────────────
  # 백엔드·프론트 빌드를 한 잡에서 순차로. build-web 은 타입 검증을 겸한다.
  build:
    name: Build (backend·web)
    runs-on: ubuntu-latest
    env:
      # 빌드 prerender 에서 ApiClient 모듈이 평가되므로 더미 URL 주입.
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate --schema=apps/core-backend/prisma/schema
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: apps/core-frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/core-frontend/package.json', 'apps/core-frontend/**/*.[jt]s', 'apps/core-frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build backend
        run: npx nest build core-backend

      - name: Build web
        run: pnpm --filter core-frontend exec next build

  # ── Integration tests (dev→main PR 에서만) ────────────────────────
  # 🔵 if: pull_request → main PR 에서만. dev push 에는 안 돈다 (DB 서비스 컨테이너가
  #    무겁고, 배포 직전에만 있으면 충분). Postgres 서비스 컨테이너 사용.
  test-integration:
    name: Integration tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weaver
          POSTGRES_PASSWORD: weaver
          POSTGRES_DB: weaver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://weaver:weaver@localhost:5432/weaver_test
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret-not-for-prod
      NODE_ENV: test
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '587'
      SMTP_USER: ci-test
      SMTP_PASS: ci-test-password

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate --schema=apps/core-backend/prisma/schema

      - name: Apply migrations
        run: pnpm prisma migrate deploy --schema=apps/core-backend/prisma/schema

      - name: Run integration tests
        run: npx jest --config apps/core-backend/test/jest-integration.json --no-coverage --ci --maxWorkers=2

  # ── E2E (dev→main PR 에서만) ──────────────────────────────────────
  # 🔵 if: pull_request → main PR 에서만. 브라우저 + 풀스택이라 가장 무겁다.
  test-e2e:
    name: E2E (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weaver
          POSTGRES_PASSWORD: weaver
          POSTGRES_DB: weaver_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://weaver:weaver@localhost:5432/weaver_e2e
      JWT_SECRET: ci-jwt-secret-not-for-prod
      CSRF_SECRET: ci-csrf-secret-not-for-prod
      # NODE_ENV=test 으로 두면 secure-cookie 강제가 비활성화되어
      # http://localhost로 cookie가 정상 전달됨.
      NODE_ENV: test
      ORIGIN_URL: localhost:4000
      CLIENT_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
      PORT: '4000'
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '587'
      SMTP_USER: ci-test
      SMTP_PASS: ci-test-password
      NEXT_PUBLIC_API_URL: /api
      API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate --schema=apps/core-backend/prisma/schema

      - name: Apply migrations
        run: pnpm prisma migrate deploy --schema=apps/core-backend/prisma/schema

      - name: Apply seeds (admin + permission groups + boards)
        run: pnpm db:seed

      - name: Build backend
        run: npx nest build core-backend

      - name: Build frontend
        run: pnpm --filter core-frontend exec next build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter core-frontend exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm --filter core-frontend e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/core-frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces / screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/core-frontend/test-results/
          retention-days: 7

  # ── 종합 게이트 (ruleset 이 이 잡 하나만 require) ──────────────────
  # if: always() + skip 관용. dev push 에선 integration·e2e 가 skip 되며(if false),
  # skip 은 failure·cancelled 가 아니라 통과로 친다. main PR 에선 둘 다 돌아 반드시 통과.
  ci-success:
    name: CI success
    if: always()
    needs:
      - checks
      - build
      - test-integration
      - test-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required CI checks passed."
