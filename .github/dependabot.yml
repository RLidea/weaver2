# 판을 당기는 손.
#
# 왜 있는가: 2026-09-15 에 운영 경로 권고 마흔아홉을 닫았는데, 그중 어느 하나도
# 우리가 판을 올려서 닫힌 게 아니었다. **상위가 이미 `^` 로 고친 판을 허용하고
# 있었고 락파일만 낡아 있었다** — 락파일을 당기는 것만으로 106건이 19건이 되었다.
# 손으로 audit 을 보고 손으로 overrides 를 적는 구조에서는 이런 게 조용히 쌓인다.
# (그 증거가 이 저장소에 남아 있다: 주간 감사가 연 security 이슈가 19주치 열려 있고
#  그동안 high 가 28 에서 72 까지 늘었다.) 그래서 정기적으로 당기는 손을 둔다.
#
# 🔴 target-branch 가 dev 인 것이 중요하다. 이 저장소는 CI 가 dev push 와
#    dev·main 으로 들어가는 PR 에서만 돈다 — **main push 에는 검사가 없다**
#    (main 은 배포 가지라 배포만 책임진다. weaver2 자신은 붙어 있는 배포 서버가
#    없지만, 파생 프로젝트에서는 scripts/auto-deploy.sh 가 origin/main 을 폴링한다).
#    그래서 main 에는 PR 로만 들어가고, dependabot PR 이 main 으로 가면
#    dev→main PR 검사라는 마지막 관문을 건너뛰게 된다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    # PR 이 스무 개면 아무도 안 본다. 패치·마이너는 한 판으로 묶는다.
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  # Actions 판도 같이 본다. 2026-09-15 현재 actions/checkout@v4 계열이
  # Node 20 폐기 경고를 내고 있었다 — 이것도 아무도 안 보는 자리였다.
  #
  # 손으로 안 올리고 여기 맡기는 이유: github-script 같은 건 메이저가 갈리면
  # security.yml 의 이슈 생성이 조용히 깨질 수 있다. 경보기를 고치는 자리에서
  # 경보기를 깨뜨릴 위험을 만들지 않는다 — PR 로 올려 CI 가 보게 한다.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    labels:
      - dependencies
    commit-message:
      prefix: 'ci(deps)'
