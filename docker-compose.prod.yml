services:
  # ============================================
  # PostgreSQL Database (Production)
  # ============================================
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Production: DB port is NOT exposed externally

  # ============================================
  # Weaver2 Application (Production)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        APP_NAME: ${DOCKER_APP_TARGET:-core}
    restart: always
    command: >
      sh -c "
        npx prisma migrate deploy --schema=apps/${DOCKER_APP_TARGET:-core}/prisma/schema.prisma &&
        node dist/apps/${DOCKER_APP_TARGET:-core}/main
      "
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
